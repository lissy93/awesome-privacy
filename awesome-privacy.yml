60|       - name: KeePass
61|         url: https://keepass.info
62|         icon: https://keepass.info/images/icons/keepass_256x256.png
63|         git: https://sourceforge.net/projects/keepass/
64|         securityAudited: true
65|         tosdrId: 3276
66|         subreddit: KeePass
67|         description: |
68|           Hardened, secure and offline password manager. Does not have cloud-sync baked
69|           in, deemed to be [gold standard](https://keepass.info/ratings.html) for secure
70|           password managers. KeePass clients: [Strongbox](https://apps.apple.com/us/app/strongbox-keepass-pwsafe/id897283731)
71|           *(Mac & iOS)*, [KeePassDX](https://play.google.com/store/apps/details?id=com.kunzisoft.keepass.free)
72|           *(Android)*, [KeeWeb](https://keeweb.info) *(Web-based/ self-hosted)*,
73|           [KeePassXC](https://keepassxc.org) *(Windows, Mac & Linux)*, see more KeePass
74|           clients and extensions at [awesome-keepass](https://github.com/lgg/awesome-keepass)
75|           by @lgg.
