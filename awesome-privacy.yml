2| # Welcome to Awesome Privacy!                                                   #
3| # This file contains all data for all listed categories, sections and services  #
4| # It's used to generate both the README.md and the website, awesome-privacy.xyz #
5| #                                                                               #
6| # USAGE COMMANDS                                                                #
7| # `make validate` - Check this file is valid YAML and fits the schema           #
8| # `make generate` - Generate + insert content into the README.md                #
9| #                                                                               #
10| # EDITING                                                                       #
11| # Please read the CONTRIBUTING.md before submitting any changes to this file    #
12| #                                                                               #
13| # ADDING SERVICE                                                                #
14| # If you're adding a new listing, the following fields are accepted:            #
15| #  - name: string (required) - The name of the service                          #
16| #  - description: string (required) - A brief description of the service        #
17| #  - url: string (required) - The URL of the service                            #
18| #  - icon: string - The URL of the service's icon                               #
19| #  - github: string - The GitHub repository of the service (user/repo-name)     #
20| #  - codeberg: string - ...or (if not GH) the Codeberg repo (user/repo-name)    #
21| #  - git: string - ...or the full URL to the repo for an external git host      #
22| #  - iosApp: string - URL to the service's iOS app on the Apple App Store       #
23| #  - androidApp: string - Package ID of Android app on Google Play Store        #
24| #  - tosdrId: integer - The ID of the service on ToS;DR  (find at tosdr.org)    #
25| #  - securityAudited: boolean - Has the service has been publicly audited       #
26| #  - openSource: boolean - Whether the service is fully open source             #
27| #  - acceptsCrypto: boolean - Whether the service accepts anonymous payment     #
28| #  - discordInvite: string - The invite code for the service's Discord server   #
29| #  - subreddit: string - The service's subreddit name (without the r/ prefix)   #
30| #  - followWith: string - Some categories need a prefix (e.g. platform)         #
31| #                                                                               #
