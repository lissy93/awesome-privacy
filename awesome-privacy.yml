77|       - name: LessPass
78|         url: https://lesspass.com
79|         followWith: Self-Hosted
80|         github: lesspass/lesspass
81|         description: |
82|           LessPass is a little different, since it generates your passwords using a hash
83|           of the website name, your username and a single main-passphrase that you reuse.
84|           It omits the need for you to ever need to store or sync your passwords. They
85|           have apps for all the common platforms and a CLI, but you can also self-host it.
